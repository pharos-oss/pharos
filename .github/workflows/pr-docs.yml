name: Typst Documentation CI/CD

on:
  pull_request:
    branches: ["dev"]
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/**'
      - 'templates/**'
      - '.pre-commit-config.yaml'
      - '.cspell.json'
      - 'justfile'
      - '.cz.yaml'
      - '.github/workflows/**'

# Minimal default permissions at the workflow level.
# Each job grants additional permissions only when strictly necessary.
permissions:
  contents: read

# Only one run per PR at a time: subsequent pushes cancel the in-progress run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-review:
    name: Build PDF and quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Read-only: this job doesn't write anything to the PR.
    # The pull-requests: write permission is confined to the `comment` job.
    permissions:
      contents: read
    outputs:
      build_mode: ${{ steps.extract-doc.outputs.build_mode }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
          lfs: true

      - name: Analyze changed files and build strategy
        id: extract-doc
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          CHANGED_FILES=$(git diff --name-only "origin/$BASE_REF"...HEAD)
          
          DOCS_TO_BUILD=""
          BUILD_ALL=false
          
          while IFS= read -r FILE; do
            if [[ "$FILE" == "templates/"* ]] || [[ "$FILE" == "docs/templates" ]] || [[ "$FILE" == "docs/templates/"* ]] || [[ "$FILE" == "justfile" ]]; then
              echo "Modifica globale rilevata ($FILE). Trigger build-all."
              BUILD_ALL=true
              break
            elif [[ "$FILE" =~ ^docs/([^/]+)/ ]]; then
              DOC_NAME="${BASH_REMATCH[1]}"
              # Allowlist validation: this name flows into GITHUB_OUTPUT, the artifact name and `just`
              if [[ ! "$DOC_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
                echo "Nome documento non valido: $DOC_NAME" >&2
                exit 1
              fi
              # Avoid duplicates in the list when multiple files in the same folder changed
              if [[ " $DOCS_TO_BUILD " != *" $DOC_NAME "* ]]; then
                DOCS_TO_BUILD="$DOCS_TO_BUILD $DOC_NAME"
              fi
            fi
          done <<< "$CHANGED_FILES"
          
          if [ "$BUILD_ALL" = true ]; then
            echo "build_mode=all" >> "$GITHUB_OUTPUT"
          elif [ -n "$DOCS_TO_BUILD" ]; then
            CLEANED_DOCS=$(echo "$DOCS_TO_BUILD" | xargs)
            
            # If the list contains spaces, multiple documents were modified
            if [[ "$CLEANED_DOCS" == *" "* ]]; then
              echo "Documenti multipli rilevati ($CLEANED_DOCS). Modalita ALL."
              echo "build_mode=all" >> "$GITHUB_OUTPUT"
            else
              echo "Un solo documento rilevato ($CLEANED_DOCS). Modalita Singolo Documento."
              echo "doc_name=$CLEANED_DOCS" >> "$GITHUB_OUTPUT"
              echo "build_mode=single" >> "$GITHUB_OUTPUT"
            fi
            
          else
            echo "Nessun documento rilevato. Trigger skip."
            echo "build_mode=skip" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Just
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0
        with:
          just-version: 1.59.0

      - name: Install prek
        run: pipx install prek==0.5.11

      - name: Cache prek sandbox
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/prek
          key: ${{ runner.os }}-prek-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-prek-

      - name: Run quality checks (files and spelling)
        run: |
          export PATH="$PATH:$HOME/.local/bin"
          just lint

      - name: Check PR commit convention (Commitizen)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          pipx run --spec commitizen==4.19.3 cz check --rev-range "origin/$BASE_REF"..HEAD

      - name: Install fonts (Liberation Sans)
        if: steps.extract-doc.outputs.build_mode != 'skip'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation

      - name: Setup Typst
        if: steps.extract-doc.outputs.build_mode != 'skip'
        uses: typst-community/setup-typst@f5c90506c7ae74fca20e339034af05c52e0eda92 # v3.1.0

      - name: Compile PDF (dynamic)
        if: steps.extract-doc.outputs.build_mode != 'skip'
        env:
          BUILD_MODE: ${{ steps.extract-doc.outputs.build_mode }}
          DOC_NAME: ${{ steps.extract-doc.outputs.doc_name }}
        run: |
          if [ "$BUILD_MODE" == "single" ]; then
            just build "$DOC_NAME"
          else
            just build-all
          fi

      - name: Upload PDF artifact
        id: upload-pdf
        if: steps.extract-doc.outputs.build_mode != 'skip'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.extract-doc.outputs.doc_name || 'tutti-i-documenti' }}-pdf
          path: docs/out/*.pdf
          retention-days: 7

  comment:
    name: PR comment (PDF preview)
    needs: build-and-review
    # Runs only if something was built and the PR doesn't come from a fork
    # (forks get a read-only token and cannot comment).
    if: needs.build-and-review.outputs.build_mode != 'skip' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # No other write scope is granted to this job.
      pull-requests: write # needed by sticky-pull-request-comment to post/update the PR comment
    steps:
      - name: Zero-Click Review (PR Bot Comment)
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: pr-pdf-review
          message: |
            ### Revisione Documentazione

            I controlli di qualità sono passati con successo.
            Puoi scaricare l'anteprima PDF dalla sezione **Artifacts**:

            **[Scarica i file PDF (Artifact)](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})**