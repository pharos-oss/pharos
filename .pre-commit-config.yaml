# .pre-commit-config.yaml
default_install_hook_types: [pre-commit, commit-msg]
fail_fast: true

repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.3
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.4.1
    hooks:
      - id: cspell
        name: Controllo ortografico file
        args: [--no-progress, --no-summary, --no-must-find-files]
        additional_dependencies:
          - "@cspell/dict-it-it"
      
      - id: cspell
        name: Controllo ortografico messaggio di commit
        stages: [commit-msg]
        args: [--no-must-find-files, --no-progress, --no-summary, --language-id, commit-msg]
        additional_dependencies:
          - "@cspell/dict-it-it"

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        name: check-added-large-files (immagini max 1MB)
        args: ['--maxkb=1024']
        files: (?i)\.(png|jpg|jpeg|gif|svg|webp)$

      - id: check-added-large-files
        name: check-added-large-files (altri file max 5MB)
        args: ['--maxkb=5120']
        exclude: (?i)\.(png|jpg|jpeg|gif|svg|webp)$

      - id: check-case-conflict
      - id: check-illegal-windows-names